name: DengueSense QC CI

on:
  push:
  pull_request:

permissions:
  contents: read
jobs:
  backend:
    name: Backend / Python
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/denguesense_qc
      SECRET_KEY: ci-test-only-not-for-production
      PORT: '5000'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: denguesense_qc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d denguesense_qc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free disk space
  uses: jlumbroso/free-disk-space@main
  with:
    android: true
    dotnet: true
    haskell: true
    large-packages: true
    tool-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install Flask-SQLAlchemy psycopg2-binary python-dotenv pytest

      - name: Check backend Python syntax
        run: python -m compileall -q backend

      - name: Run backend tests when available
        run: |
          if [ -d tests ] || [ -d backend/tests ]; then
            python -m pytest -q
          else
            echo 'No tests/ or backend/tests/ directory yet; skipping pytest.'
          fi

  frontend:
    name: Frontend / Node
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run lint when configured
        run: npm run lint --if-present

      - name: Check frontend build when configured
        run: npm run build --if-present